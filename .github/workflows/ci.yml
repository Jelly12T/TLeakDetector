# CI for TLeakDetector.
# Runs on every push to main and every pull request.
#
#   package        swift build / test of the main package (Debug + Release build)
#   release-check  TLeakDetector must never be in a Release binary (ADR 001)
#   appdemo        AppDemo still compiles (demo app and grading scenarios for the tool)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package build & test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: Build (Debug)
        run: swift build
      - name: Build (Release)
        run: swift build -c release
      - name: Test on macOS
        run: swift test
      - name: Test on iOS Simulator (all targets)
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "Simulator: $UDID"
          xcodebuild test -scheme TLeakDetector -destination "id=$UDID"

  release-check:
    name: Release has no tool symbols
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Release archive must be clean
        run: scripts/check-release-symbols.sh --configuration Release
      - name: Debug archive must contain the tool (proves the scan works)
        run: scripts/check-release-symbols.sh --configuration Debug --expect-present

  appdemo:
    name: AppDemo builds
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build AppDemo for the simulator
        run: |
          xcodebuild build \
            -project AppDemo/AppDemo.xcodeproj -scheme AppDemo -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
